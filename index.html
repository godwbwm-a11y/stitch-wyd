<style>

    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .bubble-assistant { border-bottom-left-radius: 4px !important; }
  .bubble-user { border-bottom-right-radius: 4px !important; }

    background: rgba(0,93,167,0.1);

  }
  .typing-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #cbd5e1;

  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }

    background: rgba(255,255,255,0.8);
    border: 1px solid #fecdd3;
    color: #005da7;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 9999px;
    font-size: 13px;
    cursor: pointer;

  // --- Language detection ---
  function detectLang() {
    const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    if (nav.startsWith('ko')) return 'ko';
    if (nav.startsWith('zh-hk') || nav.startsWith('zh-yue')) return 'zh-HK';
    if (nav.startsWith('zh-tw')) return 'zh-TW';
    if (nav.startsWith('zh')) return 'zh-CN';
    if (nav.startsWith('ja')) return 'ja';
    if (nav.startsWith('th')) return 'th';
    if (nav.startsWith('vi')) return 'vi';
    if (nav.startsWith('my')) return 'my';
    if (nav.startsWith('pl')) return 'pl';
    if (nav.startsWith('es')) return 'es';
    if (nav.startsWith('fr')) return 'fr';
    if (nav.startsWith('de')) return 'de';
    if (nav.startsWith('it')) return 'it';
    if (nav.startsWith('en')) return 'en';
    return 'en';
  }

  let currentLang = detectLang();

  function applyLang(code) {
    currentLang = code;
    const ui = UI[code] || UI['en'];
    // header
    document.getElementById('header-title').textContent = ui.title;
    document.getElementById('header-subtitle').textContent = ui.subtitle;
    // bottom nav
    document.getElementById('nav-schedule').textContent = ui.nav_schedule;
    document.getElementById('nav-diocese').textContent = ui.nav_diocese;
    document.getElementById('nav-chat').textContent = ui.nav_chat;
    document.getElementById('nav-register').textContent = ui.nav_register;
    document.getElementById('nav-more').textContent = ui.nav_more;
    // welcome
    document.getElementById('welcome-text').innerHTML = ui.welcome.replace(/\n/g, '<br>');
    // placeholder
    document.getElementById('input-field').placeholder = ui.placeholder;
    // lang button label
    const lang = LANGS.find(l => l.code === code);
    document.getElementById('lang-btn').textContent = lang ? lang.flag : '🌐';
    // rebuild lang list
    const list = document.getElementById('lang-list');
    list.innerHTML = LANGS.map(l => `
      <button onclick="selectLang('${l.code}')"
        class="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-rose-50 transition-colors text-[15px] ${l.code === code ? 'font-bold text-blue-600 bg-rose-50' : 'text-slate-700'}">
        <span>${l.flag}</span><span>${l.name}</span>
      </button>`).join('');
  }

  function toggleLangMenu() {
    const menu = document.getElementById('lang-menu');
    menu.classList.toggle('hidden');
  }

  function selectLang(code) {
    applyLang(code);
    document.getElementById('lang-menu').classList.add('hidden');
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#lang-btn') && !e.target.closest('#lang-menu')) {
      document.getElementById('lang-menu').classList.add('hidden');
    }
  });

  // --- State ---
  let history = [];
  let isLoading = false;

  // --- Init ---
  const now = new Date();
  document.getElementById('date-marker').textContent = now.toLocaleDateString(currentLang === 'ko' ? 'ko-KR' : 'en-US', { month: 'long', day: 'numeric', weekday: 'short' });
  document.getElementById('welcome-time').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  applyLang(currentLang);
  document.getElementById('input-field').focus();

  // --- Enter key ---
  document.getElementById('input-field').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // --- Google Form logging ---
  function logToGoogleForm(text) {
    const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSdTde7xnCtdP7mqBgPQPsPLXDREsZ9RP-m2wRmrr13jEIou8Q/formResponse';
    const body = new URLSearchParams();
    body.append('entry.804139256', text);
    fetch(formUrl, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
  }

  // --- Send from chip ---
  function sendChip(btn, text) {
    document.getElementById('chips-area').remove();
    document.getElementById('input-field').value = text;
    sendMessage();
  }

  // --- Main send function ---
  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('input-field');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    logToGoogleForm(text);
    appendUserBubble(text);
    const typingId = appendTyping();
    isLoading = true;
    setSendBtn(false);

    try {
      const reqBody = JSON.stringify({ message: text, history, lang: currentLang });
      let res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: reqBody,
      });
      // 첫 번째 요청 실패(콜드 스타트) 시 한 번 자동 재시도
      if (!res.ok) {
        await new Promise(r => setTimeout(r, 1500));
        res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: reqBody,
        });
      }
      const data = await res.json();
      removeTyping(typingId);

      const reply = data.reply || '죄송해요, 답변을 가져오지 못했어요.';
      appendAssistantBubble(reply);

      history.push({ role: 'user', text });
      history.push({ role: 'model', text: reply });
      if (history.length > 20) history = history.slice(-20);

    } catch (err) {
      removeTyping(typingId);
      appendAssistantBubble((UI[currentLang]||UI['en']).error);
    }

    isLoading = false;
    setSendBtn(true);
  }

  // --- UI helpers ---
  function getTimeStr() {
    return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  }

  function appendUserBubble(text) {
    const chatArea = document.getElementById('chat-area');
    const div = document.createElement('div');
    div.className = 'flex flex-col gap-1 items-end ml-auto max-w-[80%] msg-enter';
    div.innerHTML = `
      <div class="bg-blue-600 text-white px-5 py-4 rounded-3xl bubble-user shadow-md">
        <p class="text-[16px] leading-relaxed whitespace-pre-wrap">${escHtml(text)}</p>
      </div>
      <span class="text-[11px] text-slate-400 mr-2">${getTimeStr()}</span>
    `;
    chatArea.appendChild(div);
    scrollToEl(div);
  }

  function renderMarkdown(text) {
    return escHtml(text)
      .split('\n')
      .map(line => {
        // 줄 전체가 **제목** → 파란색 볼드 (섹션 헤더)
        if (/^\*\*[^*]+\*\*$/.test(line.trim())) {
          return line.replace(/\*\*([^*]+)\*\*/, '<strong class="text-blue-600">$1</strong>');
        }
        // 인라인 볼드 → 붉은색 볼드
        return line.replace(/\*\*(.+?)\*\*/g, '<strong class="text-rose-500">$1</strong>');
      })
      .join('<br>');
  }

  function appendAssistantBubble(text) {
    const chatArea = document.getElementById('chat-area');
    const div = document.createElement('div');
    div.className = 'flex flex-col gap-1 items-start max-w-[85%] msg-enter';
    div.innerHTML = `
      <div class="bg-white px-5 py-4 rounded-3xl bubble-assistant shadow-[0_4px_16px_rgba(255,182,193,0.2)] border border-rose-50">
        <p class="text-[17px] leading-relaxed text-slate-800">${renderMarkdown(text)}</p>
      </div>
      <span class="text-[11px] text-slate-400 ml-2">${getTimeStr()}</span>
    `;
    chatArea.appendChild(div);
    scrollToEl(div);
  }

  function appendTyping() {
    const id = 'typing-' + Date.now();
    const chatArea = document.getElementById('chat-area');
    const div = document.createElement('div');
    div.id = id;
    div.className = 'flex items-end gap-2 max-w-[90%] msg-enter';
    div.innerHTML = `
      <div class="bg-white px-5 py-4 rounded-3xl bubble-assistant shadow-[0_4px_16px_rgba(255,182,193,0.2)] border border-rose-50">
        <div class="flex gap-2 items-center">
          <div class="flex gap-1.5 items-center shrink-0">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
          <p class="text-[14px] text-slate-400 leading-snug">${(UI[currentLang]||UI['en']).loading.replace(/\n/g,'<br>')}</p>
        </div>
      </div>
    `;
    chatArea.appendChild(div);
    scrollToEl(div);
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function setSendBtn(enabled) {
    const btn = document.getElementById('send-btn');
    btn.disabled = !enabled;
    btn.style.opacity = enabled ? '1' : '0.5';
  }

  function scrollToEl(el) {
    const chatArea = document.getElementById('chat-area');
    requestAnimationFrame(() => {
      chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
    });
  }

  // 모바일 키보드 닫힐 때 맨 아래로 복원
  window.addEventListener('resize', () => {
    const chatArea = document.getElementById('chat-area');
    requestAnimationFrame(() => {
      chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
    });
  });

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

</script>
</body>
</html>
