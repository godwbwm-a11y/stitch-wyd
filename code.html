<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#f2f0f0",
                    "secondary-container": "#ff706f",
                    "inverse-primary": "#a4c9ff",
                    "tertiary-fixed-dim": "#c9c6be",
                    "on-secondary-container": "#710212",
                    "error": "#ba1a1a",
                    "surface-container-high": "#eae8e7",
                    "on-primary-fixed": "#001c39",
                    "on-primary-fixed-variant": "#004883",
                    "tertiary": "#5d5c55",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#d4e3ff",
                    "surface-container-low": "#f5f3f3",
                    "primary-fixed-dim": "#a4c9ff",
                    "surface-container-highest": "#e4e2e2",
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary-fixed-variant": "#484741",
                    "secondary": "#ab3236",
                    "secondary-fixed": "#ffdad8",
                    "outline": "#717783",
                    "error-container": "#ffdad6",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#303030",
                    "surface-dim": "#dbd9d9",
                    "on-secondary-fixed": "#410006",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c1c7d3",
                    "tertiary-fixed": "#e6e2d9",
                    "surface-bright": "#fbf9f8",
                    "on-surface": "#1b1c1c",
                    "secondary-fixed-dim": "#ffb3b0",
                    "background": "#FFF9E5",
                    "on-background": "#1b1c1c",
                    "on-secondary-fixed-variant": "#8a1921",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-tint": "#0060ac",
                    "primary": "#005da7",
                    "on-primary-container": "#fdfcff",
                    "surface-container": "#efeded",
                    "on-tertiary-fixed": "#1c1c17",
                    "primary-container": "#2976c7",
                    "surface-variant": "#e4e2e2",
                    "surface": "#FFF9E5",
                    "on-surface-variant": "#414751",
                    "on-error": "#ffffff",
                    "tertiary-container": "#76746d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "24px",
                    "gutter": "16px",
                    "unit": "8px",
                    "stack-sm": "12px",
                    "container-padding": "24px",
                    "stack-lg": "40px"
            },
            "fontFamily": {
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "label-lg": ["Plus Jakarta Sans"],
                    "chat-bubble": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "headline-lg": ["36px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "headline-md": ["28px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "chat-bubble": ["17px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bubble-assistant {
            border-bottom-left-radius: 4px !important;
        }
        .bubble-user {
            border-bottom-right-radius: 4px !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 93, 167, 0.1);
            border-radius: 10px;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
            background-color: #FFF9E5; /* Pastel Yellow background */
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col" data-mode="connect">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#FFF0F5]/95 dark:bg-gray-900/80 backdrop-blur-md border-b border-rose-100 dark:border-blue-900/30 shadow-[0_4px_12px_rgba(255,182,193,0.15)]">
<div class="w-10"></div>
<h1 class="font-['Plus_Jakarta_Sans'] text-lg font-bold tracking-tight text-blue-600 dark:text-blue-400 text-center flex-1" style="">2027 WYD 서울대회 :&nbsp;<div><div class="inline" style="">인천 교구대회</div></div></h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-rose-50 dark:hover:bg-blue-900/20 transition-colors active:scale-95 duration-200" style="">
<span class="material-symbols-outlined text-slate-400" style="">help</span>
</button>
</header>
<!-- Main Canvas / Chat Area -->
<main class="flex-1 mt-16 mb-32 max-w-2xl mx-auto w-full px-container-padding flex flex-col gap-stack-md py-stack-md custom-scrollbar overflow-y-auto">
<!-- Brand Logo Integration -->
<!-- Date Marker -->
<div class="flex justify-center mt-4">
<span class="bg-white/60 backdrop-blur-sm text-on-surface-variant text-[12px] px-3 py-1 rounded-full font-medium shadow-sm" style="">오늘</span>
</div>
<!-- Assistant Message Bubble -->
<div class="flex flex-col gap-2 items-start max-w-[85%] animate-fade-in">
<div class="flex items-end gap-2">
<div class="bg-white p-5 rounded-[24px] bubble-assistant shadow-[0_4px_16px_rgba(255,182,193,0.2)] border border-rose-50">
<p class="font-chat-bubble text-chat-bubble text-on-surface leading-relaxed" style="">안녕하세요! <br>
                        2027년 서울 세계청년대회와 <br>인천 교구대회에 대해서 <br>무엇이든 물어보세요. <br>제가 다정하게 설명해 드릴게요.
                </p>
</div>
</div>
<span class="text-[11px] text-slate-400 ml-2" style="">오전 10:00</span>
</div>
<!-- Quick Replies (Chips) -->
<div class="flex flex-wrap gap-2 mt-4">
<button class="bg-white/80 hover:bg-white border border-rose-200 text-primary font-semibold px-4 py-3 rounded-full text-label-lg transition-all active:scale-95 shadow-sm" style="">
            📅 대회 일정 보기
        </button>
<button class="bg-white/80 hover:bg-white border border-rose-200 text-primary font-semibold px-4 py-3 rounded-full text-label-lg transition-all active:scale-95 shadow-sm" style="">
            🙌 참가 안내
        </button>
<button class="bg-white/80 hover:bg-white border border-rose-200 text-primary font-semibold px-4 py-3 rounded-full text-label-lg transition-all active:scale-95 shadow-sm" style="">
            📍 주변 성당 찾기
        </button>
<button class="bg-white/80 hover:bg-white border border-rose-200 text-secondary font-semibold px-4 py-3 rounded-full text-label-lg transition-all active:scale-95 shadow-sm" style="">
            자원봉사 신청</button>
</div>
<!-- Space for more messages -->
<div class="h-24"></div>
</main>
<!-- Bottom Navigation & Input Area -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-[#FFF0F5]/95 backdrop-blur-md shadow-[0_-8px_24px_rgba(255,182,193,0.15)]">
<!-- Input Area -->
<div class="max-w-2xl mx-auto px-4 pt-4 pb-2">
<div class="relative flex items-center rounded-full px-2 py-2 border border-rose-100/50 bg-white">
<button class="w-10 h-10 flex items-center justify-center text-primary-container hover:text-primary transition-colors" style="">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;opsz&quot; 32;">mic</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface text-body-md py-2 px-2" placeholder="무엇이 궁금하신가요?" type="text">
<button class="bg-primary text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md shadow-primary/20 hover:bg-primary-container transition-all active:scale-90" style="">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">send</span>
</button>
</div>
</div>
<!-- Bottom NavBar -->
<nav class="flex justify-around items-center px-4 pt-2 pb-6">
<!-- 1. 일정 (Calendar) -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-500 px-4 py-2 hover:text-rose-500 transition-all active:scale-90 duration-150" href="#" style="">
<span class="material-symbols-outlined" style="">calendar_month</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold mt-1" style="">일정</span>
</a>
<!-- 2. 교구소개 (Church/Info) -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-500 px-4 py-2 hover:text-rose-500 transition-all active:scale-90 duration-150" href="#" style="">
<span class="material-symbols-outlined" style="">church</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold mt-1" style="">교구소개</span>
</a>
<!-- 3. 대화 (Chat/Home) - Active -->
<a class="flex flex-col items-center justify-center bg-rose-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-200 rounded-2xl px-4 py-2 active:scale-90 duration-150 transition-transform" href="#" style="">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">chat_bubble</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-bold mt-1" style="">대화</span>
</a>
<!-- 4. 신청 (Assignment/Form) -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-500 px-4 py-2 hover:text-rose-500 transition-all active:scale-90 duration-150" href="#" style="">
<span class="material-symbols-outlined" style="">assignment</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold mt-1" style="">신청</span>
</a>
<!-- 5. 더보기 (More) -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-500 px-4 py-2 hover:text-rose-500 transition-all active:scale-90 duration-150" href="#" style="">
<span class="material-symbols-outlined" style="">more_horiz</span>
<span class="font-['Plus_Jakarta_Sans'] text-[12px] font-semibold mt-1" style="">더보기</span>
</a>
</nav>
</div>
</body></html>
